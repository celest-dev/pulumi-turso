version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "gomod"
    directories:
      - "/provider"
      - "/sdk"
      - "/tests"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
